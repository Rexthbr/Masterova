<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ЧЕК-ЛИСТ: Первые 24 часа</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 700px;
            height: 650px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 48px;
            padding: 28px 28px 32px;
            box-shadow: 0 20px 40px rgba(0, 20, 40, 0.25),
                        0 8px 16px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #0b1a33;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
            flex-shrink: 0;
        }

        .subhead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 14px;
            color: #2c3e5c;
            border-bottom: 2px dashed #b3c4db;
            padding-bottom: 10px;
            flex-shrink: 0;
        }

        .subhead span {
            background: #dce5f2;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: #1e3452;
        }

        .badge-alert {
            background: #d93c3c;
            color: white;
            padding: 4px 16px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.4px;
            box-shadow: 0 4px 8px rgba(200, 40, 40, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .checklist {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        .checklist::-webkit-scrollbar {
            width: 4px;
        }

        .checklist::-webkit-scrollbar-thumb {
            background: #b3c4db;
            border-radius: 10px;
        }

        .check-item {
            background: white;
            padding: 10px 16px 10px 20px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid #dde6f0;
            transition: 0.15s;
            flex-shrink: 0;
        }

        .check-item:hover {
            border-color: #a0b8d6;
            background: #fafcff;
        }

        .check-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #1a6b3c;
            cursor: pointer;
            flex-shrink: 0;
        }

        .check-item label {
            font-size: 14px;
            font-weight: 500;
            color: #1b2d47;
            flex: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .check-item .icon {
            font-size: 16px;
            opacity: 0.7;
        }

        .check-item .tag {
            background: #e6edf6;
            padding: 2px 10px;
            border-radius: 40px;
            font-size: 10px;
            font-weight: 600;
            color: #2d4a70;
            letter-spacing: 0.3px;
        }

        .check-item .tag.high {
            background: #fce1e1;
            color: #a52727;
        }

        .check-item.done {
            background: #f0f7f0;
            border-color: #5f9d6f;
        }

        .check-item.done label {
            color: #1b4a2b;
        }

        .action-area {
            background: #e6eefa;
            border-radius: 28px;
            padding: 14px 20px 16px;
            border: 1px solid #c7d7ec;
            flex-shrink: 0;
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            justify-content: space-between;
        }

        .action-row p {
            font-weight: 500;
            color: #10304b;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        .action-row p .big-icon {
            font-size: 20px;
        }

        .btn {
            background: #1e3b60;
            border: none;
            padding: 8px 18px;
            border-radius: 60px;
            color: white;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 6px 12px rgba(20, 50, 80, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #3b5f86;
        }

        .btn:hover {
            background: #143453;
            transform: scale(1.01);
            box-shadow: 0 8px 16px rgba(0, 30, 60, 0.25);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn.secondary {
            background: #5b7a9e;
            border-color: #7a96b9;
            box-shadow: none;
        }

        .btn.secondary:hover {
            background: #3e5f82;
        }

        .timer-block {
            background: #0e253f;
            color: white;
            padding: 8px 14px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
            box-shadow: inset 0 0 0 1px #3f5f82;
        }

        .timer-block span {
            background: #1f3f60;
            padding: 2px 12px;
            border-radius: 60px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            color: #b6d4ff;
        }

        .status-msg {
            background: #dce8f5;
            border-radius: 40px;
            padding: 6px 16px;
            font-weight: 500;
            color: #103a5e;
            margin-top: 10px;
            border-left: 6px solid #1f6390;
            font-size: 13px;
            display: none;
        }

        .status-msg.show {
            display: block;
        }

        .status-msg.danger {
            border-left-color: #b22234;
            background: #fce8e8;
            color: #7a1a1a;
        }

        .status-msg.success {
            border-left-color: #1a7a3a;
            background: #e6f5ea;
            color: #0e4a24;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        @media (max-width: 720px) {
            .card {
                width: 100%;
                height: auto;
                min-height: 650px;
                border-radius: 32px;
                padding: 20px 16px 24px;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>
        <span>📋</span> ЧЕК-ЛИСТ «ПЕРВЫЕ 24 ЧАСА»
    </h1>
    <div class="subhead">
        <span>🚨 Инспектор Ростехнадзора</span>
        <span class="badge-alert">⏰ завтра в 9:00</span>
    </div>

    <!-- ЧЕК-ЛИСТ (4 пункта) -->
    <div class="checklist" id="checklistContainer">
        <div class="check-item" data-id="0">
            <input type="checkbox" id="chk0" />
            <label for="chk0">
                <span class="icon">📁</span> Вскрыть папку с документацией на СФЗ
                <span class="tag">документы</span>
            </label>
        </div>
        <div class="check-item" data-id="1">
            <input type="checkbox" id="chk1" />
            <label for="chk1">
                <span class="icon">📱</span> Провести быстрый обход периметра с камерой телефона
                <span class="tag">периметр</span>
            </label>
        </div>
        <div class="check-item" data-id="2">
            <input type="checkbox" id="chk2" />
            <label for="chk2">
                <span class="icon">📝</span> Убедиться, что на КПП есть журналы пропускного режима
                <span class="tag">КПП</span>
            </label>
        </div>
        <div class="check-item" data-id="3">
            <input type="checkbox" id="chk3" />
            <label for="chk3">
                <span class="icon">🔍</span> Проверить, есть ли в документации анализ уязвимости
                <span class="tag high">критично</span>
            </label>
        </div>
    </div>

    <!-- Панель действий + таймер -->
    <div class="action-area">
        <div class="action-row">
            <p>
                <span class="big-icon">⏱️</span>
                <span>До инспекции:</span>
            </p>
            <div class="timer-block" id="timerDisplay">
                🕒 <span id="timerValue">--:--:--</span>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn" id="resetBtn">⟳ Сбросить чек-лист</button>
            <button class="btn secondary" id="checkVulnBtn">🔎 Проверить анализ</button>
        </div>

        <div id="statusMessage" class="status-msg">
            ✅ Статус: все пункты выполнены. Готовы к инспекции.
        </div>
    </div>

</div>

<script>
    (function() {
        // ----- элементы -----
        const checkboxes = document.querySelectorAll('.check-item input[type="checkbox"]');
        const checklistItems = document.querySelectorAll('.check-item');
        const timerSpan = document.getElementById('timerValue');
        const resetBtn = document.getElementById('resetBtn');
        const checkVulnBtn = document.getElementById('checkVulnBtn');
        const statusMsg = document.getElementById('statusMessage');

        // ----- вычисляем завтра 9:00 -----
        function getTomorrow9am() {
            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(now.getDate() + 1);
            tomorrow.setHours(9, 0, 0, 0);
            return tomorrow;
        }

        let targetDate = getTomorrow9am();

        // ----- состояние (4 пункта) -----
        let checkState = [false, false, false, false];
        let timerInterval = null;
        let isTimerRunning = false;

        // ----- вспомогательные функции -----
        function getSecondsLeft() {
            const now = new Date();
            const diff = targetDate - now;
            return Math.max(0, Math.floor(diff / 1000));
        }

        function formatTime(sec) {
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function updateTimerDisplay() {
            const sec = getSecondsLeft();
            timerSpan.textContent = formatTime(sec);
            return sec;
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                isTimerRunning = false;
            }
        }

        function startTimer() {
            if (isTimerRunning) return;
            if (getSecondsLeft() <= 0) return;

            isTimerRunning = true;
            timerInterval = setInterval(() => {
                const sec = updateTimerDisplay();
                if (sec <= 0) {
                    stopTimer();
                    statusMsg.textContent = '⏰ Время вышло! Инспекция началась.';
                    statusMsg.className = 'status-msg show danger';
                }
            }, 1000);
        }

        function updateItemVisual(index) {
            const item = checklistItems[index];
            if (!item) return;
            if (checkState[index]) {
                item.classList.add('done');
            } else {
                item.classList.remove('done');
            }
        }

        function syncCheckboxes() {
            checkboxes.forEach((cb, idx) => {
                cb.checked = checkState[idx] || false;
                updateItemVisual(idx);
            });
        }

        function isAllChecked() {
            return checkState.every(v => v === true);
        }

        function updateStatusMessage() {
            const allDone = isAllChecked();
            const vulnDone = checkState[3];

            if (allDone) {
                statusMsg.textContent = '✅ Отлично! Все пункты выполнены. Вы готовы к инспекции.';
                statusMsg.className = 'status-msg show success';
                return;
            }

            if (!vulnDone) {
                statusMsg.textContent = '⚠️ Внимание: анализ уязвимости не отмечен! Это критический пункт.';
                statusMsg.className = 'status-msg show danger';
                return;
            }

            const checkedCount = checkState.filter(v => v).length;
            if (checkedCount > 0) {
                statusMsg.textContent = `📌 Выполнено ${checkedCount} из 4. Продолжайте подготовку.`;
                statusMsg.className = 'status-msg show';
            } else {
                statusMsg.className = 'status-msg';
            }
        }

        function onCheckboxChange(e) {
            const cb = e.target;
            const item = cb.closest('.check-item');
            if (!item) return;
            const index = parseInt(item.dataset.id, 10);
            if (isNaN(index)) return;

            checkState[index] = cb.checked;
            updateItemVisual(index);
            updateStatusMessage();

            if (!isTimerRunning && getSecondsLeft() > 0) {
                startTimer();
            }
        }

        function resetChecklist() {
            checkState = [false, false, false, false];
            syncCheckboxes();
            targetDate = getTomorrow9am();
            stopTimer();
            updateTimerDisplay();
            startTimer();
            statusMsg.textContent = '🔄 Чек-лист сброшен. Таймер обновлён до завтра 9:00.';
            statusMsg.className = 'status-msg show';
            setTimeout(() => {
                updateStatusMessage();
            }, 400);
        }

        function checkVulnAnalysis() {
            if (checkState[3]) {
                statusMsg.textContent = '✅ Анализ уязвимости отмечен.';
                statusMsg.className = 'status-msg show success';
            } else {
                statusMsg.textContent = '❌ Анализ уязвимости НЕ отмечен. Отметьте пункт 4.';
                statusMsg.className = 'status-msg show danger';
            }
            if (!isTimerRunning && getSecondsLeft() > 0) {
                startTimer();
            }
        }

        function init() {
            checkboxes.forEach((cb) => {
                cb.addEventListener('change', onCheckboxChange);
            });

            resetBtn.addEventListener('click', resetChecklist);
            checkVulnBtn.addEventListener('click', checkVulnAnalysis);

            syncCheckboxes();
            updateTimerDisplay();
            startTimer();
            updateStatusMessage();
        }

        init();
    })();
</script>

</body>
</html>
